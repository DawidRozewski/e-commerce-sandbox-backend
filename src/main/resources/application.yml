spring:
    application:
      name: sandbox
    datasource:
      url: ${DB_URL:jdbc:mysql://localhost:3306/sandbox}
      username: ${DB_USER:dbUser}
      password: ${DB_PASSWORD:dbPass}
    liquibase:
      change-log: classpath:liquibase-changelog.xml
    data:
      web:
        pageable:
          default-page-size: 25
          max-page-size: 100
    mail:
      host: smtp.gmail.com
      port: 587
      username: ${MAIL_ACC:mailAcc}
      password: ${MAIL_PASSWORD:mailPass}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
              required: true

server:
  error:
    include-message: always
    include-binding-errors: always

app:
  uploadDir: ./data/productImages/
  cart:
    cleanup:
      expression: "0 0 3 * * *"
  email:
    sender: empty
  serviceAddress: http://localhost:4200
  payments:
    p24:
      testMode: true
      url: https://secure.przelewy24.pl
      apiUrl: https://secure.przelewy24.pl/api/v1
      merchantId: ${MERCHANT_ID:123}
      posId: ${POS_ID:12}
      urlReturn: http://railway.com/sandbox-frontend
      urlStatus: http://railway.com/sandbox-backend
      crc: ${CRC:testCrc1}
      secretKey: ${SECRET_KEY:secretKey}

      testUrk: https://sandbox.przelewy24.pl
      testApiUrl: https://sandbox.przelewy24.pl/api/v1
      testUrlReturn: http://railway.com/sandbox-frontend
      testUrlStatus: http://railway.com/sandbox-backend
      testCrc: ${TEST_CRC:testCrc2}
      testSecretKey: ${TEST_SECRET_KEY:testSecretKey}

      servers[0]: 5.252.202.254
      servers[1]: 5.252.202.255
      servers[2]: 20.215.81.124

logging:
  level:
    org:
      springframework:
        web: info
        security: info

jwt:
  expireTime: ${EXPIRE_TIME:86400}
  secret: ${JWT_SECRET:secretKey}

